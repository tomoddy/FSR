esphome:
  name: bed-sensor
  friendly_name: Bed Sensor

rp2:
  board: rpipico2w

logger:

api:
  encryption:
    key: !secret bed_sensor_api_key

ota:
  - platform: esphome
    password: !secret bed_sensor_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: adc
    id: bed_pressure_raw
    pin: GPIO26
    update_interval: 200ms
    internal: true

  - platform: copy
    source_id: bed_pressure_raw
    name: Bed Pressure
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - throttle_average: 10s

binary_sensor:
  - platform: analog_threshold
    name: Bed Occupied
    device_class: occupancy
    sensor_id: bed_pressure_raw
    threshold:
      upper: 0.30
      lower: 0.20
    filters:
      - delayed_on: 1s
      - delayed_off: 1s
    on_press:
      - output.turn_on: onboard_led
    on_release:
      - output.turn_off: onboard_led

output:
  - platform: gpio
    id: onboard_led
    pin: LED